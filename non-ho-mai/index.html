<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Never Have I Ever · Davide Mariotti</title>
  <meta name="description" content="Never Have I Ever, the party game: 381 cards in English and Italian across love, adventure, awkward, spicy and social media.">
  <link rel="canonical" href="https://davide-mariotti.github.io/games/non-ho-mai/">
  <meta property="og:title" content="Never Have I Ever · Davide Mariotti">
  <meta property="og:description" content="One reads, whoever has done it owns up.">
  <meta property="og:image" content="https://davide-mariotti.github.io/og.png">
  <meta name="theme-color" content="#050706">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/favicon.ico" sizes="32x32">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400..700&family=Geist+Mono:wght@400..600&family=Instrument+Serif:ital@1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/games/shared/arcade.css">
  <link rel="stylesheet" href="main.css">
</head>
<body>
  <header><div class="bar">
    <a class="logo" href="/" aria-label="Davide Mariotti, home"><svg viewBox="7.5 12.5 108.8 68" role="img" aria-label="dm."><path d="M45,20V73M45,58A15,15 0 1 1 45,57.99M45,54A11,11 0 0 1 67,54V73M67,54A11,11 0 0 1 89,54V73" fill="none" stroke="#ecf3ee" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/><circle cx="107.7" cy="71.9" r="6.6" fill="#2fe37f"/></svg></a>
    <a class="back" href="/games/" data-it="&larr; Tutti i giochi">&larr; All games</a>
  </div></header>

  <main>
    <section class="stage" id="stage">
      <div class="hud">
        <div>
          <p class="kicker"><span data-it="Carta">Card</span> <span id="count">0</span></p>
          <p class="best" id="time">00:00</p>
        </div>
        <div class="hud-r">
          <button class="icon-btn" id="mute" type="button" aria-label="Sound"></button>
          <button class="icon-btn" id="settings" type="button" aria-label="Categories"><i data-icon="menu"></i></button>
        </div>
      </div>

      <div class="arena">
        <div class="card" id="game" role="group">
          <div class="face" id="face">
            <p class="cat" id="cat"></p>
            <p class="lead-in"><span class="serif grad" data-it="Non ho mai…">Never have I ever…</span></p>
            <p class="q" id="q" aria-live="polite"></p>
          </div>
        </div>
        <button class="btn btn-primary" id="next" type="button"><span data-it="Prossima">Next</span><i data-icon="arrow-right"></i></button>
      </div>

      <div class="banner" id="banner" aria-hidden="true"></div>

      <div class="overlay" id="menu">
        <div class="panel">
          <p class="kicker" data-it="Giochi · Party">Games · Party</p>
          <h1 data-it="Non ho <span class=&quot;serif grad&quot;>mai</span>">Never have <span class="serif grad">I&nbsp;ever</span></h1>
          <p class="lead" data-it="Uno legge la carta, chi l'ha fatto lo confessa. Come, lo decidete voi: un dito giù, un sorso, la storia completa.">One person reads the card, whoever has done it owns up. How is up to you: a finger down, a sip, the full story.</p>
          <fieldset class="cats" id="cats"></fieldset>
          <div class="actions">
            <button class="btn btn-primary" id="play" type="button"><i data-icon="play"></i><span id="play-label"></span></button>
            <button class="btn btn-ghost" id="restart" type="button" hidden><i data-icon="rotate-ccw"></i><span data-it="Ricomincia">Start over</span></button>
          </div>
          <p class="hint" data-it="Tocca la carta, spazio o &rarr; per la prossima · Esc chiude il menu">Tap the card, space or &rarr; for the next one · Esc closes the menu</p>
        </div>
      </div>
    </section>
  </main>

  <footer><div class="bar">
    <span data-it="Fatto da <a href=&quot;/&quot;>Davide Mariotti</a>">Made by <a href="/">Davide Mariotti</a></span>
    <a href="https://ko-fi.com/Z0X32ATNHL" data-it="Offrimi un caffè">Buy me a coffee</a>
  </div></footer>

  <script src="/games/shared/arcade.js"></script>
  <script src="questions.js"></script>
  <script src="main.js"></script>
</body>
</html>
